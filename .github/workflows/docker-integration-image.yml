name: Docker Integration Images

# Fork-only publishing. Keep this workflow off the feature branch so it
# never becomes part of the source integration branch or upstream pull requests.
on:
  push:
    branches:
      - test/integration-all-features
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-integration-images
  cancel-in-progress: false

# Build the exact tested integration commit, independently of this workflow.
env:
  SOURCE_SHA: 37e10a60958b28c8f1464016e6cad410a7f272b3

jobs:
  publish:
    name: Test and publish integration images
    if: github.repository == 'vladimir-aubrecht/backuparr'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out integration source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: backuparr:integration-smoke
          cache-from: type=gha,scope=integration-smoke-amd64
          cache-to: type=gha,mode=max,scope=integration-smoke-amd64

      - name: Smoke test the container
        run: scripts/smoke_test.sh backuparr:integration-smoke

      - name: Build restore agent for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: plex_restore_agent/Dockerfile
          platforms: linux/amd64
          load: true
          tags: backuparr:integration-agent-smoke
          cache-from: type=gha,scope=integration-agent-smoke
          cache-to: type=gha,mode=max,scope=integration-agent-smoke

      - name: Smoke test restore agent imports
        run: >-
          docker run --rm --entrypoint python backuparr:integration-agent-smoke
          -c "from plex_restore_agent.server import create_app; from plex_restore_agent.restore import RestoreManager; print('Plex restore agent imports OK')"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:integration
            ${{ steps.image.outputs.name }}:integration-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=Backuparr integration preview
          cache-from: type=gha,scope=integration-preview
          cache-to: type=gha,mode=max,scope=integration-preview

      - name: Build and push restore agent
        id: agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: plex_restore_agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:integration-plex-restore-agent
            ${{ steps.image.outputs.name }}:integration-plex-restore-agent-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=Backuparr integration Plex restore agent
          cache-from: type=gha,scope=integration-agent-preview
          cache-to: type=gha,mode=max,scope=integration-agent-preview

      - name: Write test instructions
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
        run: |
          {
            printf '### Integration preview\n\n'
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Compose image: `%s:integration`\n\n' "$IMAGE_NAME"
            printf 'Pinned image: `%s@%s`\n\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
            printf 'Restore agent: `%s:integration-plex-restore-agent`\n\n' "$IMAGE_NAME"
            printf 'Pinned agent: `%s@%s`\n\n' "$IMAGE_NAME" "$AGENT_DIGEST"
            printf 'Platforms: `linux/amd64`, `linux/arm64`.\n'
          } >> "$GITHUB_STEP_SUMMARY"
