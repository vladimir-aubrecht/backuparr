name: Docker Test Image

# Fork-only publishing. Keep this workflow off the feature branch so it
# never becomes part of the upstream Plex pull request.
on:
  push:
    branches:
      - test/plex-backup
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-test-image-plex
  cancel-in-progress: false

# Build the exact reviewed feature commit, independently of this workflow.
env:
  SOURCE_SHA: ae85355638eec8af613afc36307b4c9a94476057

jobs:
  publish:
    name: Test and publish Plex preview
    if: github.repository == 'vladimir-aubrecht/backuparr'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Plex source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: backuparr:plex-smoke
          cache-from: type=gha,scope=plex-smoke-amd64
          cache-to: type=gha,mode=max,scope=plex-smoke-amd64

      - name: Smoke test the container
        run: scripts/smoke_test.sh backuparr:plex-smoke

      - name: Build restore agent for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: plex_restore_agent/Dockerfile
          platforms: linux/amd64
          load: true
          tags: backuparr:plex-agent-smoke
          cache-from: type=gha,scope=plex-agent-smoke
          cache-to: type=gha,mode=max,scope=plex-agent-smoke

      - name: Smoke test restore agent imports
        run: >-
          docker run --rm --entrypoint python backuparr:plex-agent-smoke
          -c "from plex_restore_agent.server import create_app; from plex_restore_agent.restore import RestoreManager; print('Plex restore agent imports OK')"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:plex-backup
            ${{ steps.image.outputs.name }}:plex-backup-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=Backuparr Plex preview
          cache-from: type=gha,scope=plex-preview
          cache-to: type=gha,mode=max,scope=plex-preview

      - name: Build and push restore agent
        id: agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: plex_restore_agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:plex-restore-agent
            ${{ steps.image.outputs.name }}:plex-restore-agent-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=Backuparr Plex restore agent preview
          cache-from: type=gha,scope=plex-agent-preview
          cache-to: type=gha,mode=max,scope=plex-agent-preview

      - name: Write test instructions
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
        run: |
          {
            printf '### Plex preview\n\n'
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Compose image: `%s:plex-backup`\n\n' "$IMAGE_NAME"
            printf 'Pinned image: `%s@%s`\n\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
            printf 'Restore agent: `%s:plex-restore-agent`\n\n' "$IMAGE_NAME"
            printf 'Pinned agent: `%s@%s`\n\n' "$IMAGE_NAME" "$AGENT_DIGEST"
            printf 'Platforms: `linux/amd64`, `linux/arm64`.\n'
          } >> "$GITHUB_STEP_SUMMARY"
